name: OXCE original-only source closure and footprint

on:
  pull_request:
    paths:
      - '.github/workflows/oxce-public-source-closure.yml'
      - 'rdte/oxce-engine-synthetic/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oxce-public-source-closure-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-closure:
    name: Generate, replay, and census synthetic master (source only)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact public source without retained credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 Node24
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Syntax and negative regressions
        shell: bash
        run: |
          set -euo pipefail
          for name in generate.mjs generate-font.mjs generate-legacy.mjs \
            test-generated-master.mjs test-generated-font.mjs test-generated-legacy.mjs \
            test-stock-spawn-prerequisites.mjs verify-combined.mjs \
            test-verify-combined.mjs source-footprint.mjs test-source-footprint.mjs; do
            node --check "rdte/oxce-engine-synthetic/$name"
          done
          node --test \
            rdte/oxce-engine-synthetic/test-verify-combined.mjs \
            rdte/oxce-engine-synthetic/test-source-footprint.mjs

      - name: Reproduce complete public synthetic master in two independent roots
        shell: bash
        run: |
          set -euo pipefail
          node rdte/oxce-engine-synthetic/verify-combined.mjs \
            | tee "$RUNNER_TEMP/oxce-combined.json"
          node - "$RUNNER_TEMP/oxce-combined.json" <<'NODE'
          const fs = require('node:fs');
          const r = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (r.result !== 'PASS' || r.replay !== 'BYTE_IDENTICAL' ||
              r.nativeOXCE !== 'NOT_RUN' || r.selectedSignalFrontierGame !== 'NOT_RUN' ||
              r.files < 80 || !/^[a-f0-9]{64}$/.test(r.manifestSha256)) {
            throw new Error('fail-closed: incomplete combined public source closure');
          }
          NODE

      - name: Measure nonmutating source ablation candidates from actual generated bytes
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/oxce-original-source-root"
          test ! -e "$ROOT"
          node rdte/oxce-engine-synthetic/generate.mjs "$ROOT"
          node rdte/oxce-engine-synthetic/generate-font.mjs "$ROOT"
          node rdte/oxce-engine-synthetic/generate-legacy.mjs "$ROOT/data/SYNTHETIC"
          node rdte/oxce-engine-synthetic/source-footprint.mjs "$ROOT" \
            > "$RUNNER_TEMP/oxce-footprint.json"
          node - "$RUNNER_TEMP/oxce-footprint.json" <<'NODE'
          const fs = require('node:fs');
          const r = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (r.schema !== 'oxce.synthetic.source-footprint.v1' ||
              r.scope !== 'PUBLIC_ORIGINAL_ONLY_SOURCE_ABLATION_PLAN' ||
              r.sourceOnly !== true || r.gameplayQualified !== false ||
              r.unmodifiedStockOXCE !== 'NOT_RUN' ||
              r.selectedSignalFrontierGame !== 'NOT_RUN' ||
              r.baseline.files < 80 || r.ablationCandidates.length < 5 ||
              !/^[a-f0-9]{64}$/.test(r.baseline.manifestSha256) ||
              r.ablationCandidates.some(c => c.nativeResult !== 'NOT_RUN')) {
            throw new Error('fail-closed: invalid source-only footprint report');
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            'Generated original-only source: '+r.baseline.files+' files, '+
            r.baseline.bytes+' bytes, SHA256 manifest '+r.baseline.manifestSha256+'.\n'+
            r.ablationCandidates.length+' source-only ablation hypotheses; '+
            'native original game, player action, and gameplay NOT_RUN.\n');
          NODE

      - name: Preserve bounded public source receipts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6 Node24
        with:
          name: oxce-public-source-closure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/oxce-combined.json
            ${{ runner.temp }}/oxce-footprint.json
          retention-days: 7
          if-no-files-found: warn
