name: Verify Studio experimental release

on:
  push:
    branches:
      - semper/weapon-editor-exp
    paths:
      - 'packages/weapon-editor/**'
      - 'spikes/ruleset-tools-web/**'
      - '.github/workflows/weapon-editor-public.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: studio-exp-public-verifier
  cancel-in-progress: true

env:
  EXPERIMENTAL_TAG: studio-exp-current
  STUDIO_VERSION: '0.0.1'

jobs:
  verify-public-release:
    name: Verify unauthenticated public release
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact public candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Wait for Studio build and publisher
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          candidate="$GITHUB_SHA"
          for attempt in $(seq 1 60); do
            payload="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${candidate}&per_page=100")"
            row="$(jq -c '[.workflow_runs[] | select(.name == "OXCE Mod Studio public weapon candidate" and .event == "push")] | sort_by(.created_at) | last // empty' <<<"$payload")"
            if [[ -z "$row" ]]; then
              echo "Studio publisher workflow not visible yet (${attempt}/60)"
              sleep 15
              continue
            fi

            status="$(jq -r '.status' <<<"$row")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$row")"
            url="$(jq -r '.html_url' <<<"$row")"
            echo "Studio publisher: status=${status} conclusion=${conclusion} ${url}"

            if [[ "$status" == "completed" ]]; then
              [[ "$conclusion" == "success" ]] || { echo "Studio publisher did not succeed" >&2; exit 1; }
              exit 0
            fi
            sleep 15
          done
          echo "timed out waiting for Studio publisher" >&2
          exit 1

      - name: Reproduce expected source snapshot
        shell: bash
        run: |
          set -euo pipefail
          short="${GITHUB_SHA:0:8}"
          expected="oxce-mod-studio-experimental-${STUDIO_VERSION}-g${short}-source.zip"
          git archive \
            --format=zip \
            --prefix="oxce-mod-studio-g${short}/" \
            --output="${RUNNER_TEMP}/${expected}" \
            "$GITHUB_SHA"
          echo "EXPECTED_SOURCE=${RUNNER_TEMP}/${expected}" >> "$GITHUB_ENV"

      - name: Verify public release without credentials
        shell: bash
        run: |
          set -euo pipefail
          env -u GH_TOKEN -u GITHUB_TOKEN python3 <<'PY'
          from hashlib import sha256
          import json, os, pathlib
          from urllib.request import Request, urlopen

          repo = os.environ['GITHUB_REPOSITORY']
          tag = os.environ['EXPERIMENTAL_TAG']
          candidate = os.environ['GITHUB_SHA']
          expected_source = pathlib.Path(os.environ['EXPECTED_SOURCE'])
          headers = {'User-Agent': 'SemperSupra-studio-public-verifier/1'}

          def get(url: str) -> bytes:
              with urlopen(Request(url, headers=headers), timeout=120) as response:
                  return response.read()

          def digest(data: bytes) -> str:
              return sha256(data).hexdigest()

          release = json.loads(get(f'https://api.github.com/repos/{repo}/releases/tags/{tag}').decode('utf-8'))
          if release.get('tag_name') != tag or release.get('prerelease') is not True:
              raise SystemExit('rolling Studio release identity/prerelease state is invalid')
          assets = {a['name']: a for a in release.get('assets', [])}

          manifest_asset = assets.get('experimental-build-manifest.json')
          checksum_asset = assets.get('SHA256SUMS.txt')
          if manifest_asset is None or checksum_asset is None:
              raise SystemExit('manifest or checksum asset missing')

          manifest_bytes = get(manifest_asset['browser_download_url'])
          manifest = json.loads(manifest_bytes.decode('utf-8'))
          if manifest.get('source', {}).get('commit') != candidate:
              raise SystemExit('published Studio manifest candidate mismatch')
          if manifest.get('source', {}).get('repository') != 'SemperSupra/oxce-mod-studio':
              raise SystemExit('published Studio source repository mismatch')

          artifact = manifest.get('artifact') or {}
          vsix = assets.get(artifact.get('filename'))
          if vsix is None:
              raise SystemExit('published Studio VSIX missing')
          vsix_bytes = get(vsix['browser_download_url'])
          if digest(vsix_bytes) != artifact.get('sha256'):
              raise SystemExit('published Studio VSIX SHA-256 mismatch')

          source = manifest.get('source_archive') or {}
          if source.get('commit') != candidate:
              raise SystemExit('published Studio source archive candidate mismatch')
          if source.get('origin') != 'exact-public-candidate-commit':
              raise SystemExit('published Studio source archive origin is not exact public commit')
          if source.get('private_validator_assets_included') is not False:
              raise SystemExit('public manifest does not affirm validator assets excluded')
          source_asset = assets.get(source.get('filename'))
          if source_asset is None:
              raise SystemExit('published Studio source snapshot missing')
          source_bytes = get(source_asset['browser_download_url'])
          if digest(source_bytes) != source.get('sha256'):
              raise SystemExit('published Studio source snapshot SHA-256 mismatch')
          if digest(expected_source.read_bytes()) != source.get('sha256'):
              raise SystemExit('published Studio source snapshot is not reproducible from candidate commit')

          checksums = {}
          for line in get(checksum_asset['browser_download_url']).decode('utf-8').splitlines():
              line = line.strip()
              if not line:
                  continue
              value, name = line.split(None, 1)
              checksums[name.strip()] = value

          expected_hashes = {
              artifact['filename']: artifact['sha256'],
              source['filename']: source['sha256'],
              'experimental-build-manifest.json': digest(manifest_bytes),
          }
          for name, expected in expected_hashes.items():
              if checksums.get(name) != expected:
                  raise SystemExit(f'SHA256SUMS mismatch/missing entry for {name}')

          print(f'verified Studio public release {tag} at {candidate}')
          PY
