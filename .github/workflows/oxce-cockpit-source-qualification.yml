name: OXCE cockpit source-only qualification

on:
  pull_request:
    branches: [main]
    paths:
      - 'rdte/cockpit/**'
      - '.github/workflows/oxce-cockpit-source-qualification.yml'

permissions:
  contents: read

concurrency:
  group: oxce-cockpit-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-only:
    name: Go/Python first-party source and negative controls
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact reviewed PR source without persistent credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 Node 24
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Install Go version declared by source module
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6 Node 24
        with:
          go-version-file: rdte/cockpit/go.mod
          cache: false
      - name: Verify offline source contracts, native admission negatives, and static HTML
        working-directory: rdte/cockpit
        shell: bash
        run: |
          set -euo pipefail
          sh scripts-verify-b42.sh
      - name: Validate original native preflight Python syntax
        working-directory: rdte/cockpit
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/native_gate.py tools/test_native_gate.py tools/netlab_probe.py tools/python_native_read.py tools/test_python_native_read.py
          printf '%s\n' 'SOURCE_ONLY_CI_PASS; native game, original media, browser QA, and release NOT_RUN'
