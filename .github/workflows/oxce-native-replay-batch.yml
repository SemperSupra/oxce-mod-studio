name: Batched native OXCE evaluation against one verified binary
on:
  pull_request:
    paths:
      - ".github/workflows/oxce-native-replay-batch.yml"
      - "rdte/oxce-batch/**"
permissions:
  contents: read
  actions: read
concurrency:
  group: oxce-native-batch-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  independent-replay:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false
      - name: Source-only classifier negative controls
        run: |
          cd rdte/oxce-batch
          GO111MODULE=off go test ./...
          GO111MODULE=off go build -o "$GITHUB_WORKSPACE/.out-inspect" inspect.go
      - uses: actions/download-artifact@v4
        with:
          name: modified-oxce-tech-preview-40899658518
          run-id: 40899658518
          github-token: ${{ github.token }}
          path: .out/download
      - name: Verify immutable executable before testing
        run: |
          mkdir -p .out/package .out/evidence
          echo '217b9c4941c0f59045aacd7f0c778f4eda162fdd948931949e9c9dd0ec9c0b18  .out/download/signal-frontier-modified-oxce-linux-x86_64-TECH-PREVIEW.tar.gz' | sha256sum -c
          tar -C .out/package -xzf .out/download/signal-frontier-modified-oxce-linux-x86_64-TECH-PREVIEW.tar.gz
          test -x .out/package/openxcom-sf-rdte
          test -f .out/package/LICENSE-OXCE-GPL3.txt
          test ! -e .out/package/data/UFO
          test ! -e .out/package/data/TFTD
          sha256sum .out/package/openxcom-sf-rdte > .out/evidence/engine-sha256.txt
      - name: Apply pinned original game-rule overlay without rebuilding the engine
        run: |
          git init .out/original-game-rules
          git -C .out/original-game-rules remote add origin https://github.com/SemperSupra/oxce-mod-studio.git
          git -C .out/original-game-rules fetch --depth 1 origin ac30644599a41b761405e0fbd3f737f71974b237
          git -C .out/original-game-rules checkout --detach FETCH_HEAD
          test "$(git -C .out/original-game-rules rev-parse HEAD)" = "ac30644599a41b761405e0fbd3f737f71974b237"
          node .out/original-game-rules/rdte/oxce-engine-synthetic/generate.mjs .out/new-rules
          node --check .out/original-game-rules/rdte/oxce-engine-synthetic/generate-legacy.mjs
          node .out/original-game-rules/rdte/oxce-engine-synthetic/generate-legacy.mjs .out/package/data/SYNTHETIC
          test -s .out/package/data/SYNTHETIC/SOUND/gmgeo1.wav
          mkdir -p .out/package/user/mods/rdte-synthetic-master/SoldierName
          cp -a .out/new-rules/user/mods/rdte-synthetic-master/SoldierName/. .out/package/user/mods/rdte-synthetic-master/SoldierName/
          cp .out/new-rules/user/mods/rdte-synthetic-master/Ruleset/10-synthetic.rul .out/package/user/mods/rdte-synthetic-master/Ruleset/
          cp .out/new-rules/user/mods/rdte-synthetic-master/Language/en-US.yml .out/package/user/mods/rdte-synthetic-master/Language/
          sha256sum .out/package/user/mods/rdte-synthetic-master/Ruleset/10-synthetic.rul > .out/evidence/original-game-rules.sha256
          sha256sum .out/package/data/SYNTHETIC/SOUND/*.wav .out/package/user/mods/rdte-synthetic-master/SoldierName/*.nam > .out/evidence/original-media-name-ledger.sha256
      - name: Install runtime dependencies (no C++ compilation)
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libsdl1.2debian libsdl-image1.2 libsdl-gfx1.2-5 libsdl-mixer1.2 \
            libyaml-cpp0.7 libboost-system1.74.0 xvfb xauth imagemagick gdb
      - name: Execute three independent game-window scenarios using one binary
        shell: bash
        run: |
          for scenario in boot new-game new-battle new-game-confirm; do
            echo "Scenario $scenario"
            timeout --kill-after=2s 16s xvfb-run -a bash rdte/oxce-batch/run-case.sh \
              .out/package "$scenario" ".out/evidence/$scenario" || true
          done
          ./.out-inspect .out/evidence .out/evidence/batch-receipt.json
      - name: Symbolize first New Battle crash using the same verified engine binary
        if: always()
        shell: bash
        run: |
          timeout --kill-after=4s 35s xvfb-run -a bash rdte/oxce-batch/debug-new-battle.sh \
            .out/package .out/evidence/debug-new-battle || true
          test -s .out/evidence/debug-new-battle/gdb.log
      - name: Upload original native receipts even on failed scenario
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oxce-native-batch-${{ github.run_id }}
          path: .out/evidence/
          retention-days: 7
          if-no-files-found: warn
